name: Coin Kuşu fiyat güncellemesi

on:
  schedule:
    - cron: "17 0 * * *"      # her gün 03:17 (Türkiye saati)
  workflow_dispatch:
  push:
    paths:
      - "coin-kusu/tools/**"
      - ".github/workflows/coin-kusu-prices.yml"

permissions:
  contents: write

concurrency:
  group: coin-kusu-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python coin-kusu/tools/update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "coin-kusu-bot"
          git config user.email "coin-kusu-bot@users.noreply.github.com"
          git add coin-kusu/prices.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Coin Kuşu: update prices"
          git pull --rebase origin master
          git push origin HEAD:master
